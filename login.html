<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iniciar cesion</title>
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>
    <div class="contenedor">

        <div class="card-login">

            <h1>Dirección General</h1>

            <p class="subtitulo">
                Bienvenido al Sistema de Gestión Institucional
            </p>

            <form id="myForm">

                <div class="grupo">

                    <label>Usuario</label>

                    <input type="text" placeholder="Ingrese su usuario" id="usuario">

                    <small>
                        Introduzca el usuario creado durante el registro.
                    </small>

                </div>

                <div class="grupo">

                    <label>Contraseña</label>

                    <input type="password" placeholder="Ingrese su contraseña" id="contraseña">

                    <small>
                        Escriba su contraseña de acceso.
                    </small>

                </div>

                <div class="enlaces">

                    <a href="#">
                        ¿Olvidó su contraseña? 
                    </a>

                </div>

           <button type="submit" class="btn-login" id="btnSubmit">
                    Iniciar Sesión
           </button>

            </form>

            <div class="registro">

                <p>
                    ¿No tiene cuenta?
                </p>

                <a href="index.html">

                    Registrarse

                </a>

            </div>

        </div>

    </div>



    <script src="./js/login.js"></script>
</body>

</html>
